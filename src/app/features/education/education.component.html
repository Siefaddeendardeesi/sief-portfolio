<section class="section section--alt" id="education" aria-labelledby="education-title">
  <div class="container">
    <header class="section__head" appScrollReveal>
      <p class="section__eyebrow">Education</p>
      <h2 class="section__title" id="education-title">Academic foundation</h2>
    </header>

    <div class="education__grid">
      @for (item of education; track item.degree + item.institution) {
        <article class="card card--padded education__card" appScrollReveal>
          <span class="education__icon" aria-hidden="true">
            <app-icon name="graduation-cap" [size]="22" />
          </span>
          <h3 class="education__degree">{{ item.degree }}</h3>
          <p class="education__institution">
            {{ item.institution }} · {{ item.location }}
          </p>
          <p class="education__period">{{ item.period }}</p>
          <p class="education__summary">{{ item.summary }}</p>
        </article>
      }
    </div>
  </div>
</section>
