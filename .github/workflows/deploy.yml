name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @eslint/js@10 requires ^22.13.0 (or ^20.19.0 / >=24)
          node-version: 22.13

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npm run build:prod -- --base-href /sief-portfolio/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sief-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
